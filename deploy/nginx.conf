# /etc/nginx/sites-available/brookclean — затем: certbot --nginx -d brookclean-reg.ru -d www.brookclean-reg.ru
server {
    listen 80;
    server_name brookclean-reg.ru www.brookclean-reg.ru;
    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Service worker не кешируем, иначе обновления сайта доходят с задержкой
    location = /sw.js {
        proxy_pass http://127.0.0.1:3000;
        add_header Cache-Control "no-cache";
    }
}
