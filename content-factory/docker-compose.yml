# Контент-фабрика: PostgreSQL, миграции, API, фоновые процессы, бот.
# Запуск: cp .env.example .env && (заполнить) && docker compose up -d --build
# Для локальной разработки без внешнего S3: docker compose --profile local-s3 up -d  (MinIO)
name: content-factory

x-app: &app
  build: .
  image: brookclean-content-factory:latest
  restart: unless-stopped
  env_file: .env
  environment:
    DATABASE_URL: postgresql+asyncpg://factory:${DB_PASSWORD:?задайте DB_PASSWORD в .env}@db:5432/factory
  volumes:
    - work:/app/var/work
    - media:/app/var/media
  depends_on:
    migrate:
      condition: service_completed_successfully

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: factory
      POSTGRES_PASSWORD: ${DB_PASSWORD:?задайте DB_PASSWORD в .env}
      POSTGRES_DB: factory
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "factory"]
      interval: 5s
      retries: 20

  migrate:
    <<: *app
    restart: "no"
    command: ["migrate"]
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *app
    command: ["api"]
    ports:
      - "${API_BIND:-127.0.0.1}:${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live', timeout=3)"]
      interval: 15s
      retries: 5

  worker:
    <<: *app
    command: ["worker"]

  scheduler:
    <<: *app
    command: ["scheduler"]

  bot:
    <<: *app
    command: ["bot"]

  minio:
    profiles: ["local-s3"]
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    volumes:
      - minio:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"

volumes:
  db:
  work:
  media:
  minio:
