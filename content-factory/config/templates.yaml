# Визуальные шаблоны. Координаты — доли ширины/высоты холста (0..1).
# Цвета: brand.<имя> из настроек бренда или #RRGGBB. Шрифты: regular | bold из настроек бренда.
# Шаблоны можно менять и добавлять без изменения кода.
templates:
  cover_text:
    size: [1280, 720]
    elements:
      - {type: gradient, from: brand.secondary, to: brand.primary, direction: diagonal}
      - {type: rect, box: [0.06, 0.12, 0.012, 0.42], color: brand.accent}
      - {type: text, field: headline, box: [0.1, 0.12, 0.78, 0.46], font: bold, size: [96, 44], color: brand.text, valign: top}
      - {type: text, field: subline, box: [0.1, 0.62, 0.78, 0.16], font: regular, size: [40, 24], color: brand.text, valign: top}
      - {type: logo, box: [0.78, 0.82, 0.18, 0.12], align: right}
      - {type: text, field: footer, box: [0.06, 0.86, 0.66, 0.08], font: regular, size: [26, 18], color: brand.text, valign: middle}

  cover_photo:
    size: [1280, 720]
    elements:
      - {type: image, field: photo, box: [0, 0, 1, 1], fit: cover}
      - {type: shade, from_y: 0.35, color: "#000000", opacity: [0, 0.82]}
      - {type: rect, box: [0.06, 0.56, 0.012, 0.26], color: brand.accent}
      - {type: text, field: headline, box: [0.1, 0.5, 0.82, 0.3], font: bold, size: [80, 40], color: brand.text, valign: bottom}
      - {type: text, field: subline, box: [0.1, 0.81, 0.62, 0.1], font: regular, size: [32, 20], color: brand.text, valign: top}
      - {type: logo, box: [0.8, 0.82, 0.16, 0.12], align: right}
      - {type: disclosure, box: [0.02, 0.02, 0.6, 0.05], font: regular, size: [20, 14], color: "#FFFFFF"}

  square_post:
    size: [1080, 1080]
    elements:
      - {type: gradient, from: brand.primary, to: brand.secondary, direction: vertical}
      - {type: text, field: headline, box: [0.08, 0.14, 0.84, 0.46], font: bold, size: [100, 48], color: brand.text, valign: top}
      - {type: rect, box: [0.08, 0.64, 0.2, 0.01], color: brand.accent}
      - {type: text, field: subline, box: [0.08, 0.68, 0.84, 0.16], font: regular, size: [44, 26], color: brand.text, valign: top}
      - {type: logo, box: [0.08, 0.87, 0.3, 0.09], align: left}

  vertical_poster:
    size: [1080, 1920]
    elements:
      - {type: image, field: photo, box: [0, 0, 1, 1], fit: cover, optional: true}
      - {type: gradient, from: brand.secondary, to: brand.primary, direction: vertical, when_missing: photo}
      - {type: shade, from_y: 0.4, color: "#000000", opacity: [0, 0.85]}
      - {type: text, field: headline, box: [0.08, 0.52, 0.84, 0.26], font: bold, size: [120, 56], color: brand.text, valign: bottom}
      - {type: text, field: subline, box: [0.08, 0.79, 0.84, 0.1], font: regular, size: [48, 28], color: brand.text, valign: top}
      - {type: logo, box: [0.08, 0.04, 0.34, 0.07], align: left}
      - {type: text, field: footer, box: [0.08, 0.92, 0.84, 0.05], font: regular, size: [34, 22], color: brand.text, valign: middle}
      - {type: disclosure, box: [0.5, 0.04, 0.46, 0.04], font: regular, size: [24, 16], color: "#FFFFFF", align: right}

  checklist:
    size: [1080, 1350]
    elements:
      - {type: fill, color: brand.secondary}
      - {type: rect, box: [0, 0, 1, 0.26], color: brand.primary}
      - {type: text, field: headline, box: [0.07, 0.04, 0.86, 0.18], font: bold, size: [72, 36], color: brand.text, valign: middle}
      - {type: numbered_list, field: points, box: [0.07, 0.3, 0.86, 0.58], font: regular, size: [44, 24], color: brand.text, badge: brand.accent, badge_text: brand.text_dark}
      - {type: text, field: subline, box: [0.07, 0.885, 0.6, 0.06], font: regular, size: [30, 20], color: brand.text, valign: middle}
      - {type: logo, box: [0.7, 0.88, 0.23, 0.08], align: right}

  route:
    size: [1080, 1350]
    elements:
      - {type: gradient, from: brand.secondary, to: brand.primary, direction: vertical}
      - {type: text, field: headline, box: [0.07, 0.05, 0.86, 0.16], font: bold, size: [72, 36], color: brand.text, valign: middle}
      - {type: route_line, field: points, box: [0.12, 0.26, 0.76, 0.56], font: bold, size: [46, 26], color: brand.text, line: brand.accent}
      - {type: text, field: subline, box: [0.07, 0.85, 0.6, 0.08], font: regular, size: [30, 20], color: brand.text, valign: middle}
      - {type: logo, box: [0.7, 0.86, 0.23, 0.08], align: right}

  video_thumbnail:
    size: [1080, 1920]
    elements:
      - {type: image, field: photo, box: [0, 0, 1, 1], fit: cover}
      - {type: shade, from_y: 0.45, color: "#000000", opacity: [0, 0.8]}
      - {type: text, field: headline, box: [0.08, 0.6, 0.84, 0.26], font: bold, size: [110, 52], color: brand.text, valign: bottom}
      - {type: logo, box: [0.08, 0.9, 0.3, 0.06], align: left}

  title_card:
    size: [1080, 1920]
    elements:
      - {type: gradient, from: brand.secondary, to: brand.primary, direction: vertical}
      - {type: logo, box: [0.25, 0.2, 0.5, 0.14], align: center}
      - {type: text, field: headline, box: [0.08, 0.4, 0.84, 0.3], font: bold, size: [104, 48], color: brand.text, valign: middle, align: center}
      - {type: text, field: subline, box: [0.08, 0.72, 0.84, 0.14], font: regular, size: [52, 28], color: brand.text, valign: top, align: center}

  text_overlay:
    size: [1080, 1920]
    transparent: true
    elements:
      - {type: text_box, field: headline, box: [0.06, 0.12, 0.88, 0.2], font: bold, size: [72, 36], color: brand.text, background: brand.secondary, opacity: 0.78}
