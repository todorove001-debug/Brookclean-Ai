# Цены для ОЦЕНКИ стоимости до запуска платной операции и для расчёта по фактическим единицам.
# Поставщики меняют цены — сверяйте с их страницами тарифов и правьте этот файл без изменения кода.
# Все суммы в долларах США.
llm:
  # за 1 млн токенов
  claude-opus-5-5: {input: 4.00, output: 20.00, cache_read: 0.20, cache_write: 5.00}
  claude-sonnet-5-5: {input: 2.00, output: 10.00, cache_read: 0.20, cache_write: 2.50}
  claude-haiku-5-5: {input: 0.10, output: 0.50, cache_read: 0.01, cache_write: 0.125}
  default: {input: 4.00, output: 20.00, cache_read: 0.20, cache_write: 5.00}
web_search:
  per_request: 0.01
images:
  # за одно изображение, по качеству
  default: {low: 0.02, medium: 0.07, high: 0.19, auto: 0.19}
video:
  openai_sora:
    # за секунду ролика
    sora-2: {per_second: 0.10}
    sora-2-pro: {per_second: 0.30}
  runway:
    credit_usd: 0.01
    # кредитов за секунду ролика (для оценки; фактическую стоимость Runway возвращает в задаче)
    gen4.5: {credits_per_second: 12}
    default: {credits_per_second: 12}
transcription:
  whisper-1: {per_minute: 0.006}
  default: {per_minute: 0.006}
