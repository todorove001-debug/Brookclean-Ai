# Настройки канала при первом запуске. Дальше они хранятся в базе и меняются через Admin API
# (PUT /api/v1/channel, /api/v1/brand, /api/v1/budget) без изменения кода.
name: Brookclean Trucks
description: Перевозка автомобилей автовозами из Владивостока по России

brand:
  company_name: Brookclean Trucks
  logo: config/brand/logo.jpg          # путь к файлу или storage:<ключ> после загрузки через API
  colors:
    primary: "#1F4FA3"
    secondary: "#0E1B2E"
    accent: "#F2B705"
    text: "#FFFFFF"
    text_dark: "#0E1B2E"
    background: "#0E1B2E"
  fonts:
    regular: /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf
    bold: /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf
  contacts: ["Telegram: +7 950 281-55-55", "brookclean-trucks.ru"]   # печатаются на обложках и в концовке видео
  hashtags: ["#автовоз", "#перевозкаавто"]
  voice: >-
    Спокойный экспертный тон человека, который каждый день грузит машины на автовоз.
    Конкретика вместо восклицаний, без канцелярита и рекламного пафоса, обращение на «вы».
  synthetic_disclosure: Иллюстрация создана с помощью ИИ

schedule:
  timezone: Europe/Moscow
  posts_per_day_min: 4
  posts_per_day_max: 7
  slots: ["09:00", "12:00", "15:00", "18:00", "20:30"]
  windows:
    - {start: "08:00", end: "22:00"}
  min_gap_minutes: 90
  production_lead_days: 2

mix:
  shares: {short_post: 0.25, article: 0.12, image_post: 0.12, infographic: 0.08, video: 0.25, poll: 0.06, ad: 0.08, story: 0.04}
  videos_per_month_min: 30
  videos_per_month_max: 60

rubrics:
  - {key: news, title: Новости автологистики, description: "Новости рынка перевозок и автомобильной логистики", needs_sources: true}
  - {key: law, title: Законодательство, description: "Изменения правил и законов, влияющие на перевозку и ввоз автомобилей", needs_sources: true}
  - {key: buyer_tips, title: Советы покупателям, description: "Что проверить при покупке машины в другом регионе и перед отправкой"}
  - {key: preparation, title: Подготовка к перевозке, description: "Как подготовить автомобиль к погрузке на автовоз"}
  - {key: loading, title: Погрузка и крепление, description: "Как машины грузят, крепят и везут на автовозе"}
  - {key: routes, title: Маршруты, description: "Логистика между Владивостоком и регионами: особенности дороги, сезонность"}
  - {key: faq, title: Вопросы клиентов, description: "Ответы на частые вопросы о перевозке"}
  - {key: myths, title: Мифы и ошибки, description: "Разбор распространённых заблуждений и ошибок при перевозке автомобиля"}
  - {key: service, title: Об услуге, description: "Рассказ об услуге перевозки на основе утверждённых фактов"}
  - {key: cases, title: Истории перевозок, description: "Реальные перевозки по материалам владельца", requires_owner_material: true}

routes:
  - {origin: Владивосток, destination: Новосибирск}
  - {origin: Владивосток, destination: Москва}
  - {origin: Владивосток, destination: Краснодар}
  - {origin: Владивосток, destination: Санкт-Петербург}
  - {origin: Владивосток, destination: Тюмень}

# Куда ведут призывы к действию. Ключ — имя цели, значение — URL (оборачивается в отслеживаемую ссылку /r/<код>).
# Например: calc: https://brookclean.ru/  или  manager: https://t.me/<менеджер>
cta_targets:
  manager: https://t.me/+79502815555    # менеджер в Telegram (по номеру +7 950 281-55-55)

# RSS-ленты отраслевых СМИ и госорганов для Research Agent. Добавляйте только проверенные адреса.
rss_feeds: []

budget:
  # Решение владельца 30.10.2026: не больше 250 $ в месяц на ИИ.
  daily_limit_usd: 12
  monthly_limit_usd: 250
  max_task_cost_usd: 3
  video_generations_per_month: 0   # ИИ-видео пока не используется (VIDEO_PROVIDER=none); ролики — только из ваших съёмок
  max_retries_paid: 2
  warn_thresholds: [0.5, 0.8, 0.95]
  hard_stop: true

qa:
  max_auto_fix_rounds: 1
  ad_marking_required: false   # маркировка рекламы (erid): решение принимает владелец или юрист
  publish_prices: false        # решение владельца 29.10.2026: цены не публикуются, стоимость сообщает менеджер

# Сведения о компании — единственный источник фактов о компании для текстов.
# approved: true — владелец подтвердил письменно (сообщение от 29.10.2026). Остальные ждут утверждения:
#   factory facts list  /  factory facts approve <ключ>
# Новые записи из этого файла добавляются в работающую систему командой factory facts sync.
approved_facts:
  - key: service.car_carrier
    category: service
    statement: "Компания перевозит легковые автомобили автовозами из Владивостока по России."
    approved: true
  - key: route.cities
    category: route
    statement: >-
      Доставка автомобилей из Владивостока в города: Хабаровск, Новосибирск, Красноярск, Кемерово, Барнаул, Омск,
      Тюмень, Екатеринбург, Пермь, Ижевск, Курган, Челябинск, Уфа, Тольятти, Самара, Казань, Чебоксары, Киров,
      Нижний Новгород, Рязань, Владимир, Москва, Санкт-Петербург, Пенза, Саратов, Воронеж, Волгоград,
      Ростов-на-Дону, Краснодар.
    approved: true
  - key: term.vvo_nsk
    category: terms
    statement: "Ориентировочный срок доставки Владивосток — Новосибирск: летом 6–8 дней, зимой 8–10 дней."
    approved: true
  - key: term.vvo_msk
    category: terms
    statement: "Ориентировочный срок доставки Владивосток — Москва: летом 10–12 дней, зимой 15–20 дней."
    approved: true
  - key: term.vvo_krd
    category: terms
    statement: "Ориентировочный срок доставки Владивосток — Краснодар: летом 12–16 дней, зимой 16–25 дней."
    approved: true
  - key: term.factors
    category: terms
    statement: >-
      Сроки ориентировочные и могут меняться: на скорость доставки влияют дорожная обстановка, пробки, задержки
      в пути, возможные поломки техники и наличие топлива на заправках.
    approved: true
  - key: contact.telegram
    category: contact
    statement: "Связаться с менеджером можно в Telegram по номеру +7 950 281-55-55."
    approved: true
  - key: contact.phone
    category: contact
    statement: "Телефон: +7 (950) 281-55-55."
    approved: true
  - key: contact.site
    category: contact
    statement: "Сайт компании: brookclean-trucks.ru."
    approved: true
  # Ниже — из прайс-листа, но без явного разрешения на публикацию. Утвердите, если согласны.
  - key: contact.address
    category: contact
    statement: "Офис во Владивостоке: ул. Чукотская, 1."
  - key: service.vehicle_types
    category: service
    statement: "Перевозим седаны, кроссоверы, минивэны и джипы; для джипов, минивэнов и автомобилей S-класса условия рассчитываются индивидуально."
  - key: service.insurance
    category: terms
    statement: "Страхование автомобиля на время перевозки оформляется отдельно: 0,3% от полной стоимости автомобиля."
