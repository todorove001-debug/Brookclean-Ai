# Истории перевозок от владельца (сообщение от 29.10.2026). По ним Copywriter пишет посты рубрики «Истории перевозок».
# Модель не добавляет фактов сверх написанного здесь. Загрузка в систему: factory stories load
stories:
  - key: ideal_trips_2026
    title: "Идеальные рейсы: до Москвы за 9 дней"
    text: >-
      Скорость доставки всегда складывается из множества факторов: дорожная обстановка, пробки, задержки,
      что-то может сломаться в дороге, сильно влияет и наличие топлива на заправках. В этом году было
      несколько идеальных рейсов, когда всё сложилось идеально, и автовозы до Москвы прибыли за 9 дней.
      Клиенты даже не поняли, как так получилось: вроде машина только вчера выехала, а уже приехала.
      Бывает и обратная сторона, когда в пути случается серьёзная поломка.

  - key: gearbox_breakdown_khabarovsk
    title: "Поломка под Хабаровском и всё равно в Москве за 17–18 дней"
    text: >-
      Летом под Хабаровском у тягача вышел из строя блок управления коробкой передач: коробка перестала
      включаться, не работала ни одна передача. Вызывали электрика — на это ушло двое суток. Потом подогнали
      другой свой тягач, отцепили неисправный от прицепа, прицеп повезли дальше, а для тягача вызвали эвакуатор.
      В сервисе он простоял ещё трое суток. Даже при всех этих проблемах автовоз доехал до Москвы за 17–18 дней.

  - key: fuel_crisis_2026
    title: "Топливный кризис: как мы планировали заправки"
    text: >-
      В этом году из-за топливного кризиса нужно было чётко рассчитывать запас хода и места заправок, чтобы
      хватало проехать участки, где топлива нет, и не встать в многодневную очередь за топливом. На некоторые
      автовозы даже поставили дополнительные баки.

  - key: toyota_c_pod
    title: "Самая необычная машина: Toyota C+pod поперёк платформы"
    text: >-
      Самая необычная машина, которую мы перевозили, — Toyota C+pod. Она настолько маленькая, что мы погрузили
      её поперёк платформы автовоза, и места хватило ещё на четыре автомобиля. Машина произвела фурор, собрала
      много восторженных взглядов и улыбок, и у всех был один вопрос: куда мы её везём? Доставка была в
      Челябинск: её купил себе взрослый мужчина, чтобы ездить по деревне в магазин.
