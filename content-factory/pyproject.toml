[project]
name = "brookclean-content-factory"
version = "0.1.0"
description = "AI Content Factory: подготовка, согласование и публикация контента Telegram-канала Brookclean Trucks"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162,<1",
    "uvicorn[standard]>=0.54",
    "sqlalchemy[asyncio]>=2.1,<2.2",
    "asyncpg>=0.32",
    "alembic>=1.20",
    "pydantic>=2.14,<3",
    "pydantic-settings>=2.16",
    "httpx>=0.28,<0.29",
    "anthropic>=2.3,<3",
    "structlog>=26.1",
    "boto3>=1.43",
    "pillow>=13.0",
    "sentry-sdk>=2.73",
    "prometheus-client>=0.26",
    "feedparser>=6.0.14",
    "selectolax>=1.0",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0",
    "tzdata>=2026.6",
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
mtproto = ["telethon>=1.41"]

[dependency-groups]
dev = [
    "pytest>=9.2",
    "pytest-asyncio>=1.4",
    "respx>=0.23",
    "moto[server]>=5.2",
    "ruff>=0.14",
    "asgi-lifespan>=2.1",
]

[project.scripts]
factory = "app.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = [
    "ffmpeg: требует установленный FFmpeg",
    "db: требует PostgreSQL (TEST_DATABASE_URL)",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC"]
# ASYNC240/221: короткие локальные операции с файлами и CLI-процессы допустимы; UP046/047: TypeVar читается привычнее.
ignore = ["S101", "B008", "S603", "S607", "E501", "ASYNC240", "ASYNC221", "ASYNC109", "UP046", "UP047"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]
