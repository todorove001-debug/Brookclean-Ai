<title>Brookclean Автовоз</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Unbounded:wght@500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: app shell — role tabs on top; client & tracking in a phone-width column, manager full width. Ink navy + road-sign amber. */
:root{
  --bg:#eef1f4; --surface:#ffffff; --paper:#fbfcfd; --ink:#14202e; --muted:#5b6878; --line:#d5dbe2;
  --accent:#f2a900; --accent-ink:#1b1400; --route:#2b5d8a; --route-soft:#dce7f1;
  --ok:#1f7a52; --ok-soft:#dcf1e6; --warn:#9a5b00; --warn-soft:#fbefd6; --err:#b3362a; --err-soft:#f8e0dd;
  --f-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f151c; --surface:#17202a; --paper:#1b2531; --ink:#e6ebf0; --muted:#93a1b0; --line:#2a3642;
  --accent:#f5b81c; --accent-ink:#1b1400; --route:#6fa3d6; --route-soft:#1d3247;
  --ok:#4cc58f; --ok-soft:#173528; --warn:#e9a845; --warn-soft:#3a2a10; --err:#ef7a6d; --err-soft:#3d1c19;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f151c; --surface:#17202a; --paper:#1b2531; --ink:#e6ebf0; --muted:#93a1b0; --line:#2a3642;
  --accent:#f5b81c; --accent-ink:#1b1400; --route:#6fa3d6; --route-soft:#1d3247;
  --ok:#4cc58f; --ok-soft:#173528; --warn:#e9a845; --warn-soft:#3a2a10; --err:#ef7a6d; --err-soft:#3d1c19;
  color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 96px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--ink)}
h1,h2,h3{text-wrap:balance;margin:0}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-size:.92em}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--ink);color:var(--bg);
  margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:10px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
.top-in{max-width:1200px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:700;font-size:15px;letter-spacing:.02em}
.brand .plate{background:var(--accent);color:var(--accent-ink);border-radius:4px;padding:2px 7px;font-size:11px;letter-spacing:.08em}
.brand small{font-family:var(--f-body);font-weight:400;opacity:.7;font-size:12px;letter-spacing:0}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tab{background:none;border:0;color:inherit;opacity:.65;padding:8px 12px 10px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap;font-weight:500}
.tab[aria-selected="true"]{opacity:1;border-color:var(--accent)}
.tab:hover{opacity:1}
.sitebar{display:flex;align-items:center;gap:8px;font-size:12px;flex-wrap:wrap;opacity:.9}
.sitebar .addr{display:flex;gap:2px;background:rgba(255,255,255,.1);border-radius:999px;padding:3px}
.sitebar button{border:0;background:none;color:inherit;border-radius:999px;padding:4px 10px;cursor:pointer;font-family:var(--f-mono);font-size:12px;opacity:.75;min-height:28px}
.sitebar button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);opacity:1;font-weight:600}
.sms-in{background:var(--bg);border:1px solid var(--line);border-radius:14px 14px 14px 4px;padding:10px 12px;font-size:13px;max-width:300px}
.sms-in small{display:block;color:var(--muted);font-size:11px;margin-bottom:2px}

.note{max-width:1200px;margin:12px auto 0;font-size:13px;color:var(--muted)}
.note b{color:var(--ink);font-weight:600}

.view{max-width:1200px;margin:16px auto 0}
.col{max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:14px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.card h2{font-family:var(--f-display);font-weight:500;font-size:17px}
.card h3{font-size:14px;font-weight:600}
.eyebrow{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* stepper */
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.step{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--muted)}
.step i{display:block;height:4px;border-radius:2px;background:var(--line)}
.step.on{color:var(--ink);font-weight:600}
.step.on i,.step.done i{background:var(--accent)}

/* form */
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:13px;font-weight:500}
.field input,.field select{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:10px 11px;min-height:44px}
.field input:focus,.field select:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 30%,transparent)}
.field .hint{font-size:12px;color:var(--muted)}
.field .err{font-size:12px;color:var(--err)}
.field.bad input{border-color:var(--err)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--bg);padding:9px 4px;cursor:pointer;font-size:13px;line-height:1.25;min-height:44px}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);font-weight:600}
.examplebar{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;color:var(--muted);background:var(--route-soft);border-radius:8px;padding:6px 10px}
.linkbtn{background:none;border:0;color:var(--route);cursor:pointer;padding:4px 0;font-weight:600;font-size:13px;text-decoration:underline;text-underline-offset:2px}

/* quote */
.quote{display:flex;flex-direction:column;gap:6px}
.qrow{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.qrow span:last-child{font-variant-numeric:tabular-nums;white-space:nowrap}
.qtotal{border-top:1px dashed var(--line);padding-top:8px;margin-top:2px;font-weight:700;font-size:17px}
.qtotal span:last-child{font-family:var(--f-display);font-weight:700}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.err{background:var(--err-soft);color:var(--err)}
.pill.info{background:var(--route-soft);color:var(--route)}
.pill.gray{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.callout{border-radius:8px;padding:10px 12px;font-size:13px}
.callout.warn{background:var(--warn-soft);color:var(--warn)}
.callout.info{background:var(--route-soft);color:var(--route)}
.callout.ok{background:var(--ok-soft);color:var(--ok)}

/* buttons */
.btn{border:0;border-radius:8px;padding:12px 16px;font-weight:600;cursor:pointer;min-height:46px}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.primary:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.dark{background:var(--ink);color:var(--bg)}
.btn.sm{padding:6px 10px;min-height:34px;font-size:13px}
.actions{display:flex;gap:10px}
.actions .btn{flex:1}

/* sticky bottom total */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:4;background:var(--surface);border-top:1px solid var(--line);
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.dock-in{max-width:460px;margin:0 auto;display:flex;align-items:center;gap:12px}
.dock-sum{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.2}
.dock-sum small{color:var(--muted);font-size:12px}
.dock-sum b{font-family:var(--f-display);font-size:18px}
.dock .btn{min-width:140px}

/* document */
.doc{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:18px 16px;font-family:"Times New Roman",Georgia,serif;font-size:14px;line-height:1.45;display:flex;flex-direction:column;gap:8px;max-height:420px;overflow:auto}
.doc .c{text-align:center}
.doc .t{font-weight:700;text-align:center}
.doc table{border-collapse:collapse;width:100%;font-size:13px}
.doc td{border:1px solid var(--line);padding:5px 7px;vertical-align:top}
.doc td:first-child{width:38%;color:var(--muted)}
.doc .new{background:var(--warn-soft);border-left:3px solid var(--accent);padding:6px 8px;font-size:13px}
.doc .fold{color:var(--muted);font-style:italic;font-size:13px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px;cursor:pointer}
.check input{width:20px;height:20px;margin-top:1px;accent-color:var(--accent);flex:none}

.codebox{display:flex;gap:8px}
.codebox input{font-family:var(--f-mono);font-size:22px;letter-spacing:.4em;text-align:center}
.sms{background:var(--ink);color:var(--bg);border-radius:14px 14px 14px 4px;padding:10px 12px;font-size:13px;max-width:300px}
.sms small{display:block;opacity:.6;font-size:11px;margin-bottom:2px}
.stamp{border:2px solid var(--route);color:var(--route);border-radius:8px;padding:10px 12px;font-size:12px;font-family:var(--f-mono);line-height:1.5;word-break:break-all}
.stamp b{font-family:var(--f-body);font-size:13px}

.copyline{display:flex;gap:6px;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 6px 6px 10px}
.copyline code{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--f-mono);font-size:13px;user-select:all}

/* tracking route */
.route{list-style:none;margin:0;padding:0;position:relative}
.stop{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;min-height:40px;position:relative}
.stop::before{content:"";position:absolute;left:13px;top:0;bottom:0;width:3px;background:var(--line)}
.stop:first-child::before{top:50%}
.stop:last-child::before{bottom:50%}
.stop.passed::before{background:var(--route)}
.stop.half::before{background:linear-gradient(var(--route) 50%,var(--line) 50%)}
.stop .dot{width:14px;height:14px;border-radius:50%;background:var(--surface);border:3px solid var(--line);justify-self:center;position:relative;z-index:1}
.stop.passed .dot,.stop.half .dot{border-color:var(--route);background:var(--route)}
.stop.dest .dot{width:18px;height:18px;border-radius:4px}
.stop .km{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.stop.dest .name{font-weight:700}
.truck{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:center;position:relative;min-height:38px}
.truck::before{content:"";position:absolute;left:13px;top:0;bottom:0;width:3px;background:linear-gradient(var(--route) 50%,var(--line) 50%)}
.truck .ic{width:28px;height:28px;border-radius:50%;background:var(--accent);display:grid;place-items:center;position:relative;z-index:1;box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 30%,transparent)}
.truck .ic svg{width:16px;height:16px}
.truck .lbl{font-size:13px;font-weight:600}
@media (prefers-reduced-motion:no-preference){.truck .ic{animation:pulse 2s ease-in-out infinite}}
@keyframes pulse{50%{box-shadow:0 0 0 8px color-mix(in srgb,var(--accent) 12%,transparent)}}
.bigstatus{font-family:var(--f-display);font-size:22px;font-weight:700;line-height:1.2}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
.drvact{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--paper);display:flex;flex-direction:column;gap:6px}
.drvact .kv{font-size:13px}
.histbox{border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--paper);display:flex;flex-direction:column;gap:10px;margin:-2px 0 6px}
.histbox h4{margin:0;font-size:14px}
.shot .pill{white-space:normal}
.events{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:13px}
.events li{display:flex;gap:10px}
.events time{font-family:var(--f-mono);color:var(--muted);flex:none;white-space:nowrap}
.progress{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--route)}

/* manager */
.mgr{display:flex;flex-direction:column;gap:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.kpi b{font-family:var(--f-display);font-size:20px;font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--muted)}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.sheet-title{display:flex;align-items:center;gap:8px;font-weight:600}
.sheet-title .gs{width:22px;height:22px;border-radius:4px;background:var(--ok);display:grid;place-items:center}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table.sheet{border-collapse:collapse;font-size:13px;min-width:1500px;width:100%}
.sheet th{position:sticky;top:0;background:var(--bg);text-align:left;font-weight:600;font-size:12px;color:var(--muted);padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
.sheet th.grp{text-align:center;color:var(--ink);border-left:1px solid var(--line)}
.sheet td{padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle}
.sheet td.r,.sheet th.r{text-align:right;font-variant-numeric:tabular-nums}
.sheet td.bl,.sheet th.bl{border-left:1px solid var(--line)}
.sheet tr.fresh td{background:var(--warn-soft)}
.sheet tfoot td{font-weight:700;background:var(--bg)}
.sheet input[type=checkbox]{width:18px;height:18px;accent-color:var(--ok)}
.sheet select{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:3px 4px;font-size:12px}
.trips{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.trip-orders{display:flex;flex-wrap:wrap;gap:6px}
.inline{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.inline select{flex:1;min-width:140px;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px;min-height:38px}

/* partner */
.plist{display:flex;flex-direction:column;gap:8px;font-size:14px}
.plist .pi{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding-bottom:8px}
.plist .pi:last-child{border-bottom:0;padding-bottom:0}

.toast{position:fixed;left:50%;transform:translateX(-50%);width:max-content;text-align:center;bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;z-index:20;max-width:calc(100% - 32px)}
/* cabinets */
.subnav{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.subtab{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;cursor:pointer;white-space:nowrap;font-weight:500;font-size:14px;min-height:38px;display:inline-flex;align-items:center;gap:6px}
.subtab[aria-current="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.subtab.out{margin-left:auto;color:var(--muted)}
.badge{display:inline-grid;place-items:center;min-width:18px;height:18px;border-radius:9px;background:var(--accent);color:var(--accent-ink);font-size:11px;font-weight:700;padding:0 5px}
.seg.two{grid-template-columns:1fr 1fr}
.form{display:flex;flex-direction:column;gap:12px}
.field textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:10px 11px;font:inherit;color:inherit;resize:vertical}
.kpis.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.elist{display:flex;flex-direction:column}
.eitem{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.eitem:last-child{border-bottom:0}
.eitem.fresh{background:var(--warn-soft);border-radius:6px}
.eitem small{color:var(--muted)}
.eitem .amt{font-weight:700;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.eico{width:40px;height:40px;border-radius:8px;background:var(--bg);border:1px solid var(--line);display:grid;place-items:center;font-size:11px;color:var(--muted);overflow:hidden}
.eico img{width:100%;height:100%;object-fit:cover}
.field input:disabled{opacity:.6}
/* deliveries */
.cellin{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:4px 6px;font:inherit;font-size:13px;color:inherit;width:100%;min-width:120px}
.bhform{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;align-items:end}
/* drivers */
.docgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}
/* digital act */
.actlogo{width:56px;height:58px;object-fit:contain;border-radius:6px;background:#fff;padding:2px}
.codes{display:flex;flex-wrap:wrap;gap:4px}
.codebtn{border:1px solid var(--line);background:var(--bg);border-radius:6px;min-width:40px;min-height:34px;font-weight:700;cursor:pointer;font-family:var(--f-mono)}
.codebtn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.diagram{position:relative;background:#fff;border:1px solid var(--line);border-radius:8px;cursor:crosshair;max-width:100%;touch-action:manipulation;user-select:none}
.diagram.ro{cursor:default}
.diagram img{display:block;width:100%;height:auto}
.mark{position:absolute;transform:translate(-50%,-50%);min-width:30px;height:30px;padding:0 5px;border-radius:15px;border:2px solid #fff;background:#1d3fa0;color:#fff;font:700 12px var(--f-mono);cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.35)}
.mark.ai{background:#c0392b}
.legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:4px 12px;font-size:13px;padding-top:6px}
.sigpad{width:100%;aspect-ratio:3/1;background:#fff;border:1px dashed var(--line);border-radius:8px;touch-action:none;cursor:crosshair}
.sigimg{width:100%;aspect-ratio:3/1;object-fit:contain;background:#fff;border:1px solid var(--line);border-radius:8px}
.aibox{display:flex;flex-direction:column;gap:6px}
.aiitem{border-left:3px solid var(--warn);background:var(--warn-soft);border-radius:6px;padding:6px 8px;display:flex;flex-direction:column;gap:4px;font-size:13px}
.aiitem.yes{border-color:var(--err);background:var(--err-soft)}
.aiitem.no{border-color:var(--line);background:var(--bg)}
/* chain act */
.chainbar{display:flex;flex-wrap:wrap;gap:6px}
.chainstep{border:1px solid var(--line);border-left:4px solid var(--c);border-radius:6px;padding:3px 8px;font-size:12px;color:var(--muted)}
.chainstep.cur{color:var(--ink);font-weight:700;background:var(--bg)}
.chainstep.done{color:var(--ink)}
.transfer{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;background:var(--bg);border-radius:8px;padding:10px 12px}
.transfer div{display:flex;flex-direction:column;min-width:0}
.transfer > span{font-size:22px;color:var(--muted)}
.stagedot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:middle}
.deflist{display:flex;flex-direction:column;gap:8px}
.defitem{border:1px solid var(--line);border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;gap:4px}
.defitem.removed{opacity:.55}.defitem.removed b{text-decoration:line-through}
.mk{display:inline-grid;place-items:center;min-width:28px;height:24px;border-radius:12px;color:#fff;font:700 12px var(--f-mono);padding:0 6px}

// Сумма прописью: 215000 → «двести пятнадцать тысяч»
function words(n){
  const o=["","один","два","три","четыре","пять","шесть","семь","восемь","девять"],of=["","одна","две"].concat(o.slice(3));
  const te=["десять","одиннадцать","двенадцать","тринадцать","четырнадцать","пятнадцать","шестнадцать","семнадцать","восемнадцать","девятнадцать"];
  const tn=["","","двадцать","тридцать","сорок","пятьдесят","шестьдесят","семьдесят","восемьдесят","девяносто"];
  const hu=["","сто","двести","триста","четыреста","пятьсот","шестьсот","семьсот","восемьсот","девятьсот"];
  const sc=[[null],[["тысяча","тысячи","тысяч"],1],[["миллион","миллиона","миллионов"],0]];
  const pl=(x,f)=>{x%=100;if(x>10&&x<20)return f[2];x%=10;return x===1?f[0]:(x>=2&&x<=4?f[1]:f[2])};
  if(!n)return "ноль";const parts=[];let i=0;
  while(n>0){const t=n%1000;if(t){const w=[hu[Math.floor(t/100)]];const d=t%100;
      if(d>=10&&d<20)w.push(te[d-10]);else{w.push(tn[Math.floor(d/10)]);w.push((sc[i][1]?of:o)[d%10])}
      if(i>0)w.push(pl(t,sc[i][0]));parts.unshift(w.filter(Boolean).join(" "))}
    n=Math.floor(n/1000);i++}
  return parts.join(" ");
}
function rubWords(n){const f=["рубль","рубля","рублей"];const x=n%100,y=n%10;const r=(x>10&&x<20)?f[2]:y===1?f[0]:(y>=2&&y<=4)?f[1]:f[2];
  return new Intl.NumberFormat("ru-RU").format(n)+" ("+words(n)+") "+r}
function maskVin(v){return v.length>6?v.slice(0,v.length-4).replace(/./g,(c,i)=>i<3?c:"•")+v.slice(-4):v}

async function sha256(text){try{const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(text));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}catch(e){let h=0;for(const c of text)h=(h*31+c.charCodeAt(0))>>>0;return h.toString(16).padStart(8,"0")+"…(демо)"}}

const VIN17=/^[A-HJ-NPR-Z0-9]{17}$/, FRAME=/^[A-Z0-9]{2,7}-\d{5,7}$/;
function validate(step){
  const f=S.f,e={};
  if(step===0){
    if(f.car.trim().length<2)e.car="Укажите марку и модель";
    const v=f.vin.trim().toUpperCase();
    if(!(VIN17.test(v)||FRAME.test(v)))e.vin="Нужен VIN из 17 знаков или номер кузова вида ZVW51-6123456";
    const y=+f.year;if(!(y>=1990&&y<=2026))e.year="Год от 1990 до 2026";
    if(!f.color.trim())e.color="Укажите цвет";
    if(numOnly(f.value)<100000)e.value="Стоимость от 100 000 ₽";
    if(!f.city)e.city="Выберите город";
  }
  if(step===1){
    if(f.fio.trim().split(/\s+/).length<2)e.fio="Фамилия, имя и отчество полностью";
    if(String(f.phone).replace(/\D/g,"").length!==11)e.phone="Номер в формате +7 900 000 00 00";
    if(!/^\d{4}$/.test(f.pser))e.pser="4 цифры";
    if(!/^\d{6}$/.test(f.pnum))e.pnum="6 цифр";
    if(f.pissued.trim().length<5)e.pissued="Кем выдан паспорт";
    if(!f.pdate)e.pdate="Дата выдачи";
    if(f.addr.trim().length<8)e.addr="Адрес регистрации";
  }
  S.errs=e;return !Object.keys(e).length;
}

/* маршрут заказа: одно плечо или два через терминал */
const TERMINALS={"Новосибирск":{name:"Терминал Новосибирск",addr:"г. Новосибирск, ул. Станционная, 60 (пример)"},
  "Владивосток":{name:"Площадка приёмки Владивосток",addr:"СВХ, Уссурийск, ул. Штабского, 14Г"}};
function legsOf(o){return o.legs||[{trip:o.trip,from:"Владивосток",to:o.city}]}
function onTrip(o,t){return legsOf(o).some(l=>l.trip===t.id)}
function legTrip(o,i){const l=legsOf(o)[i];return l&&S.trips.find(t=>t.id===l.trip)}
function tripRoute(t){const r=routeFor(t.dest);return r.slice(Math.max(0,r.indexOf(t.origin||"Владивосток")))}
function loadCityOf(o){const t=legTrip(o,0);return t?(t.loadCity||t.origin||"Владивосток"):"Владивосток"}
function checkpointsOf(o){const pr=loadCityOf(o)==="Владивосток"?"terminal":"driver";
  // погрузка водителю — отдельная передача, когда машину принял приёмщик площадки
  const head=[{id:"priemka",leg:0,role:pr}].concat(pr==="terminal"?[{id:"pogruzka",leg:0,role:"driver"}]:[]);
  return legsOf(o).length>1
  ?head.concat([{id:"term_in",leg:0,role:"terminal"},{id:"term_out",leg:1,role:"terminal"},{id:"vygruzka",leg:1,role:"driver"}])
  :head.concat([{id:"vygruzka",leg:0,role:"driver"}])}
function cpNum(o,id){return String(checkpointsOf(o).findIndex(c=>c.id===id)+1).padStart(2,"0")}
function cpDone(o,id){return !!(o.media&&o.media[id]&&o.media[id].doneAt)}
// где машина сейчас: фаза, километр от Владивостока, текущий рейс
function orderPos(o){
  const L=legsOf(o), dest=NET[o.city][1], paid=o.payDel&&o.payIns;
  if(o.delivered)return {phase:"delivered",km:dest,text:"Выдан",cls:"ok",trip:legTrip(o,L.length-1)};
  if(L.length>1){
    const tk=NET[o.transfer][1], t1=legTrip(o,0), t2=legTrip(o,1);
    if(cpDone(o,"term_out")){const k=Math.min(Math.max(t2?t2.km:tk,tk),dest);
      if(k>=dest)return {phase:"arrived",km:dest,text:"Прибыл",cls:"ok",trip:t2,leg:1};
      if(k===tk)return {phase:"loaded2",km:tk,text:"Погружен · рейс 2",cls:"info",trip:t2,leg:1};
      return {phase:"moving",km:k,text:"В пути · рейс 2",cls:"info",trip:t2,leg:1}}
    if(cpDone(o,"term_in"))return {phase:"terminal",km:tk,text:"На терминале",cls:"warn",trip:t2,leg:1};
    if(!t1)return {phase:"wait",km:0,text:paid?"Оплачен":"Подписан",cls:paid?"ok":"warn"};
    if(t1.km>=tk)return {phase:"atTerminal",km:tk,text:"Разгрузка на терминале",cls:"info",trip:t1,leg:0};
    if(t1.km>0)return {phase:"moving",km:t1.km,text:"В пути · рейс 1",cls:"info",trip:t1,leg:0};
    return {phase:"loading",km:0,text:"Погрузка "+t1.loadDate,cls:"gray",trip:t1,leg:0};
  }
  const t=legTrip(o,0);
  if(!t)return {phase:"wait",km:0,text:paid?"Оплачен":"Подписан",cls:paid?"ok":"warn"};
  if(t.km>=dest)return {phase:"arrived",km:dest,text:"Прибыл",cls:"ok",trip:t,leg:0};
  if(t.km>0)return {phase:"moving",km:t.km,text:"В пути",cls:"info",trip:t,leg:0};
  return {phase:"loading",km:0,text:"Погрузка "+t.loadDate,cls:"gray",trip:t,leg:0};
}
function tripOf(o){return orderPos(o).trip||legTrip(o,0)}
function statusOf(o){const p=orderPos(o);return {text:p.text,cls:p.cls}}
// можно ли завершить этап осмотра
function cpGate(o,id){
  const cps=checkpointsOf(o),i=cps.findIndex(c=>c.id===id),cp=cps[i],prev=cps[i-1];
  if(prev&&!cpDone(o,prev.id))return {ok:false,why:`Сначала нужен этап «${STAGES[prev.id].name}».`};
  const t=legTrip(o,cp.leg);
  // приёмка на стоянку возможна до назначения рейса
  if(!t&&id!=="priemka")return {ok:false,why:"Рейс для этого плеча ещё не назначен. Его назначает менеджер."};
  if(id==="term_in"&&t.km<NET[o.transfer][1])return {ok:false,why:`Автовоз ${t.id} ещё не на терминале ${o.transfer}. Снимать можно заранее, завершить — по прибытии.`};
  if(id==="term_out"&&!tripFormed(t))return {ok:false,why:`Рейс ${t.id} ещё не сформирован. Сформируйте его во вкладке «Сформировать рейс».`};
  if(id==="vygruzka"&&t.km<NET[o.city][1])return {ok:false,why:`Автовоз ещё не в городе получателя. Снимать можно заранее, а завершить сдачу — только в городе ${o.city}.`};
  return {ok:true};
}
const TRUCK_SVG=`<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M2 15V7h11v8M13 10h4l3 3v2h-7" stroke="#1b1400" stroke-width="2" stroke-linejoin="round"/><circle cx="6" cy="17" r="2" fill="#1b1400"/><circle cx="16.5" cy="17" r="2" fill="#1b1400"/></svg>`;

    <select id="trk">${S.orders.map(x=>`<option value="${x.no}" ${x.no===o.no?"selected":""}>${CLIENT_HOST}/t/${x.token} · ${esc(x.car)} → ${esc(x.city)}${x.transfer?" (через "+x.transfer+")":""}</option>`).join("")}</select></div>
   <div class="card">

const pmXY=([la,lo])=>[(lo-PMAP.L0)*PMAP.C*PMAP.K,(PMAP.A1-la)*PMAP.K];
function geoKm(a,b){const R=6371,r=Math.PI/180,dl=(b[0]-a[0])*r,dn=(b[1]-a[1])*r,h=Math.sin(dl/2)**2+Math.cos(a[0]*r)*Math.cos(b[0]*r)*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
function corrIdx(p){let bi=-1,bd=1e9;CORR.forEach((c,i)=>{const d=geoKm(p,[c[1],c[2]]);if(d<bd){bd=d;bi=i}});return {i:bi,d:bd}}
// название точки: ближайший пункт коридора; крупный — для заголовков маршрутов
function permPlace(p,big){let best=null,bd=1e9;for(const c of CORR){if(big&&c[3]!==1)continue;const d=geoKm(p,[c[1],c[2]]);if(d<bd){bd=d;best=c}}
  if(!best)return p.map(v=>v.toFixed(3)).join(", ");if(big&&bd>160)return permPlace(p,false);if(big)return best[0];return (bd>30&&!/^р-н /.test(best[0])?"р-н ":"")+best[0]}
// линия маршрута по коридору; если точка далеко от трасс коридора — прямой отрезок
function permPath(a,b){const A=corrIdx(a),B=corrIdx(b);if(A.d>90||B.d>90)return {pts:[a,b],rough:true};
  const s=A.i<=B.i?1:-1,mid=[];for(let i=A.i+s;i!==B.i;i+=s)mid.push([CORR[i][1],CORR[i][2]]);return {pts:[a,...mid,b],rough:false}}

/* даты в выписке — ДД.ММ.ГГГГ */
const pmDate=s=>{const m=/^(\d\d)\.(\d\d)\.(\d{4})$/.exec(s||"");return m?new Date(+m[3],+m[2]-1,+m[1]):null};
const pmFmt=d=>pad2(d.getDate())+"."+pad2(d.getMonth()+1)+"."+d.getFullYear();
const pmAdd=(d,n)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);
const pmToday=()=>{const n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate())};
const pmDays=(a,b)=>Math.round((b-a)/864e5);
const pmShort=no=>String(no).split("/").pop();
const dn=n=>{const a=Math.abs(n)%100,b=a%10;return a>10&&a<20?"дней":b===1?"день":b>=2&&b<=4?"дня":"дней"};
function permAll(){return S.permits.flatMap(f=>f.items.map(p=>({...p,file:f})))}
// статус срока: подать на новое разрешение нужно за permitLead дней до окончания (оформление 5–7 дней)
function permState(p){const t=pmToday(),from=pmDate(p.from),to=pmDate(p.to);if(!from||!to)return {k:"gray",l:"Нет дат",left:0};
  const lead=S.settings.permitLead||7,apply=pmAdd(to,-lead),left=pmDays(t,to),toApply=pmDays(t,apply),renew=p.file.renew;
  const base={from,to,apply,left,toApply,total:pmDays(from,to)+1,gone:Math.max(0,pmDays(from,t))};
  if(t<from)return {...base,k:"info",l:"Начнёт действовать "+p.from};
  if(left<0)return {...base,k:"err",l:"Истекло "+p.to};
  if(renew)return {...base,k:left<=lead?"warn":"info",l:"Новое оформляется с "+renew};
  if(toApply<0)return {...base,k:"err",l:`Срочно подать на новое: осталось ${left} ${dn(left)}`};
  if(toApply<=14)return {...base,k:"warn",l:`Пора готовить новое: подать до ${pmFmt(apply)}`};

// для водителя: успевает ли его рейс по сроку разрешений
function permTripCheck(t,route){if(!t||!route||!route.to)return "";const m=/^(\d{1,2})\.(\d{1,2})$/.exec(t.loadDate||"");if(!m)return "";
  const y=pmToday().getFullYear(),dep=new Date(y,+m[2]-1,+m[1]),dist=Math.max(0,(NET[t.dest]||[0,0])[1]-(NET[t.origin||"Владивосток"]||[0,0])[1]),days=Math.ceil(dist/(S.settings.kmDay||500)),eta=pmAdd(dep,days);
  const ok=eta<=route.to;return `<div class="callout ${ok?"ok":"err"}">Рейс ${esc(t.id)}: выезд ${pmFmt(dep)}, ${esc(t.origin||"Владивосток")} → ${esc(t.dest)} ≈ ${km(dist)} км, прибытие ≈ ${pmFmt(eta)}. ${ok?`Разрешения действуют до ${pmFmt(route.to)} — успеваете с запасом ${pmDays(eta,route.to)} ${dn(pmDays(eta,route.to))}.`:`Разрешения заканчиваются ${pmFmt(route.to)} — раньше прибытия. Сообщите менеджеру.`}</div>`}
function vPermits(){

  if(!routes.length)return `<div class="col">${mgr?permFiles():""}<section class="card"><h2>Разрешения</h2><p class="muted">${mgr?"Загрузите PDF выписок из реестра спецразрешений.":"Для вашего тягача разрешений пока нет. Менеджер добавит их сюда."}</p></section></div>`;
  let r=routes.find(x=>x.id===S.pm.route)||(trip&&routes.find(x=>x.name.startsWith(trip.origin||"Владивосток")))||routes[0];S.pm.route=r.id;
  const items=r.legs.filter(l=>!l.gap).map(l=>l.p),sel=items.some(p=>p.no===S.pm.sel)?S.pm.sel:null,selP=items.find(p=>p.no===sel);
  const worst=items.map(permState).sort((a,b)=>a.left-b.left)[0],lead=S.settings.permitLead||7,kd=S.settings.kmDay||500;
  const drive=Math.ceil((r.km+r.gaps.reduce((s,g)=>s+g.km,0))/kd),lastDep=pmAdd(r.to,-drive);
  const head=`<section class="card pm-head">

      <div class="muted">${items.length} ${items.length===1?"разрешение":items.length<5?"разрешения":"разрешений"} · ${km(r.km)} км по разрешениям · тягач ${esc(items[0].tractor?items[0].tractor.model:"—")}</div></div>
      <span class="pill ${worst.k}">${esc(worst.l)}</span></div>
    <div class="pm-validity"><div><small class="muted">Маршрут открыт, пока действуют все разрешения</small><div class="pm-big">${pmFmt(r.from)} <span class="muted">—</span> ${pmFmt(r.to)}</div></div>
      <div class="pm-left ${worst.k}"><b>${Math.max(0,worst.left)}</b><small>${dn(Math.max(0,worst.left))} осталось</small></div></div>
    ${permBar(worst)}
    <div class="pm-dl">
      <div><small class="muted">Подать на новые разрешения</small><b>до ${pmFmt(worst.apply)}</b><small class="muted">оформление 5–7 дней, запас ${lead} дн.</small></div>
      <div><small class="muted">Последний выезд, чтобы пройти весь маршрут</small><b>${pmFmt(lastDep)}</b><small class="muted">≈ ${drive} сут при ${km(kd)} км/сут</small></div>
    </div>
    ${r.gaps.map(g=>`<div class="callout err">Участок ${esc(permPlace(g.a))} — ${esc(permPlace(g.b))} (≈ ${km(g.km)} км по схеме) не покрыт загруженными разрешениями. Проверьте, нужно ли на него разрешение.</div>`).join("")}
    ${!mgr?permTripCheck(trip,r):""}
  </section>`;
  const tabs=routes.length>1?`<div class="inline">${routes.map(x=>`<button class="subtab" data-act="pm-route" data-id="${esc(x.id)}" aria-current="${x.id===r.id}">${esc(x.name)}</button>`).join("")}</div>`:"";
  const legs=r.legs.map(l=>l.gap?`<div class="pm-leg gap"><b>Разрыв: ${esc(permPlace(l.a))} → ${esc(permPlace(l.b))}</b><span class="muted">нет разрешения в загруженных файлах</span></div>`:permLegCard(l.p,sel,mgr)).join("");
  const memo=!mgr?(()=>{const seen=new Map();items.forEach(p=>p.conds.filter(c=>PM_KEY.test(c.t)).forEach(c=>{if(!seen.has(c.t))seen.set(c.t,new Set());c.roads.forEach(x=>seen.get(c.t).add(x))}));
    const lim=items.map(p=>`<li><span>${esc(permPlace(p.start))} → ${esc(permPlace(p.end))}: масса с грузом не более <b>${p.mass?String(p.mass[1]).replace(".",","):"—"} т</b>, габариты ${p.dims?esc(p.dims.join(" × ")):"—"} м, скорость до ${esc(String(p.speed).replace(/\.0$/,""))} км/ч</span></li>`).join("");
    return `<section class="card"><h2>Памятка в пути</h2><ul class="pm-conds key">${lim}${[...seen].map(([t,rs])=>`<li><span>${esc(t)}</span><small class="muted">${esc([...rs].join(", "))}</small></li>`).join("")}</ul></section>`})():"";
  return `<div class="${mgr?"pm pm-wide":"col pm"}">${tabs}${head}
    <section class="card pm-mapcard"><div class="inline" style="justify-content:space-between"><h2>Маршрут на карте</h2>${sel?`<button class="btn sm ghost" data-act="pm-sel" data-no="">Весь маршрут</button>`:""}</div>
      ${permMap(r,sel,mgr?1150:430)}
      <div class="pm-legend muted"><span><i class="lg on"></i>${sel?"выбранное разрешение":"по разрешениям"}</span>${sel?`<span><i class="lg off"></i>другие разрешения маршрута</span>`:""}${r.gaps.length?`<span><i class="lg gap"></i>не покрыто разрешением</span>`:""}<span><i class="lg dot s"></i>начало</span><span><i class="lg dot e"></i>конец</span></div>
      <div class="pm-legs">${legs}</div></section>
    ${selP?permDetail(selP,mgr):`<p class="muted" style="margin:0">Нажмите на разрешение, чтобы увидеть его на карте, дороги и особые условия.</p>`}
    ${memo}${mgr?permFiles():""}</div>`;
}
function permBadge(){return permAll().filter(p=>{const k=permState(p).k;return k==="warn"||k==="err"}).length}

function vCab(){
  const u=me();if(!u)return vAuth();
  const subs=u.role==="terminal"&&u.terminal==="Владивосток"?[["incoming","К приёмке"],["yard","Приняты"],["drivers","Водители"],["profile","Профиль"]]
    :u.role==="driver"&&termCarsFor(S.trips.find(x=>x.driverId===u.id)).length?[["accept","Приёмка авто"],["trip","Мой рейс"],["report","Рейсовый отчёт"],["permits","Разрешения"],["profile","Профиль"]]:SUBS[u.role];if(!subs.some(s=>s[0]===S.sub))S.sub=subs[0][0];
  const pend=S.users.filter(x=>x.status==="pending").length, waiting=S.trips.filter(t=>t.report.status==="submitted").length;
  const pb=permBadge(),badge=k=>k==="permits"&&pb?`<span class="badge">${pb}</span>`:u.role!=="manager"?"":k==="staff"&&pend?`<span class="badge">${pend}</span>`:k==="reports"&&waiting?`<span class="badge">${waiting}</span>`:"";
  const nav=`<nav class="subnav" aria-label="Разделы кабинета">${subs.map(([k,l])=>`<button class="subtab" data-sub="${k}" aria-current="${S.sub===k}">${l}${badge(k)}</button>`).join("")}<button class="subtab out" data-act="logout">Выйти</button></nav>`;
  let body="";
  if(u.role==="manager")body=S.mgrHo?vMediaView():S.sub==="orders"?vManager("orders"):S.sub==="deliv"?`<div class="mgr">${vDeliveries()}</div>`:S.sub==="termbal"?`<div class="mgr">${vTermBalance()}</div>`:S.sub==="drivers"?`<div class="mgr">${vDriversPage()}</div>`:S.sub==="ledger"?`<div class="mgr">${vTermSettle()}</div>`:S.sub==="trips"?vManager("trips"):S.sub==="reports"?vMgrReports():S.sub==="settings"?vSettings():S.sub==="permits"?vPermits():vStaff();
  if(u.role==="driver"){const ho=S.ho&&S.orders.find(o=>o.no===S.ho.no);body=S.sub==="accept"?(ho?vHandover(ho,S.ho.stage,false):vAccept()):S.sub==="report"?vDriverReport():S.sub==="trip"?vDriverTrip():S.sub==="permits"?vPermits():vProfile()}
  if(u.role==="partner")body=S.sub==="links"?vPartner():vProfile();
  if(u.role==="terminal")body=S.sub==="drivers"&&!S.ho?vDriversPage():S.sub==="settle"&&!S.ho?`<div class="mgr">${vTermSettle()}</div>`:S.sub==="form"&&!S.ho?`<div class="mgr">${vTripForm()}</div>`:vTerminal();
  const wide=u.role==="manager"||(u.role==="terminal"&&!S.ho&&["settle","drivers","form"].includes(S.sub));
  return wide?`<div class="mgr">${nav}${body}</div>`:`<div class="col">${nav}${body}</div>`;
}

function login(){
  const A=S.auth, d=digits(A.login), u=S.users.find(x=>x.login===d&&x.role!=="partner");
  A.ok="";

  if(u.status==="pending"){A.err="Заявка ещё на проверке у менеджера. Пришлём SMS, когда доступ откроют.";return render()}
  if(u.status==="rejected"){A.err="Заявка отклонена. Свяжитесь с менеджером.";return render()}
  if(u.status==="blocked"){A.err="Доступ заблокирован. Свяжитесь с менеджером.";return render()}
  S.session=u.id;S.sub=null;A.err="";A.pass="";render();toast("Вы вошли как "+u.short);
}
function register(){
  const A=S.auth,R=A.reg,E={},d=digits(R.phone),parts=R.name.trim().split(/\s+/);

  else if(S.users.some(u=>u.login===d))E.phone="Этот телефон уже зарегистрирован. Войдите или восстановите пароль";

function daysUntil(dm){const m=/^(\d{1,2})\.(\d{1,2})$/.exec(dm||"");if(!m)return 99;const n=new Date();return Math.round((new Date(n.getFullYear(),+m[2]-1,+m[1])-new Date(n.getFullYear(),n.getMonth(),n.getDate()))/864e5)}

function terminalTrips(o){return routeFor(o.city).includes(TRANSFER_CITY)&&o.city!==TRANSFER_CITY

function routeAdvice(o){
  const N=S.settings.directWaitDays, d=directTrips(o).filter(t=>daysUntil(t.loadDate)<=N), tt=terminalTrips(o);
  if(d.length)return {kind:"direct",trip:d[0],text:`Есть прямой рейс ${d[0].id} до ${d[0].dest}, погрузка ${d[0].loadDate}.`};
  if(tt.length)return {kind:"terminal",trip:tt[0],text:`Прямого рейса на ${o.city} в ближайшие ${N} дн. нет. Рекомендуем через терминал ${TRANSFER_CITY}: рейс ${tt[0].id}, погрузка ${tt[0].loadDate}.`};

/* приёмщик площадки во Владивостоке: приёмка к перевозке */
function vYardOrigin(u){
  const city=u.terminal;
  // машины с погрузкой в этом городе, включая новые заявки без рейса — они приезжают на стоянку
  const q=S.orders.filter(o=>!o.delivered&&loadCityOf(o)===city);
  const todo=q.filter(o=>!cpDone(o,"priemka")), done=q.filter(o=>cpDone(o,"priemka"));
  const line=o=>{const t=legTrip(o,0);return `№${o.no} · <b>${esc(o.car)}</b>, ${esc(o.color)}<br><small class="muted"><span class="mono">${esc(o.vin)}</span> → ${esc(o.city)}${o.transfer?" (через "+esc(o.transfer)+")":""} · ${t?`рейс ${t.id}, погрузка ${esc(t.loadDate)}`:`<span style="color:var(--warn)">рейс не назначен</span> · договор от ${esc(o.date)}`}</small>`};
  if(S.sub==="incoming")return `<div class="card"><div class="eyebrow">${esc(TERMINALS[city].name)}</div><h2>К приёмке · ${todo.length}</h2>
    <div class="plist">${todo.map(o=>{const hs=hoStat(o,"priemka");return `<div class="pi"><span style="min-width:0">${line(o)}</span>
      <span style="display:flex;flex-direction:column;align-items:flex-end;gap:4px"><button class="btn sm primary" data-act="ho-open" data-stage="priemka" data-no="${o.no}">Принять</button>
      ${hs.started?`<small class="muted">фото ${hs.pc}/10 · видео ${hs.vc}</small>`:""}</span></div>`}).join("")||`<p class="muted" style="margin:0">Все машины приняты.</p>`}</div>
    <div class="muted" style="font-size:12px">Во Владивостоке осмотр при погрузке делает приёмщик: 10 фото, 5–7 видео и акт. Водитель только подписывает акт.</div></div>`;
  if(S.sub==="yard")return `<div class="card"><div class="eyebrow">${esc(TERMINALS[city].name)}</div><h2>Приняты · ${done.length}</h2>
    <div class="plist">${done.map(o=>{const t=legTrip(o,0);return `<div class="pi"><span style="min-width:0">${line(o)}<br><small class="muted">принята ${esc(hoOf(o,"priemka").doneAt)}</small></span>
      <span style="display:flex;flex-direction:column;align-items:flex-end;gap:4px"><span class="pill ${!t?"gray":cpDone(o,"pogruzka")?"ok":"warn"}">${!t?"на стоянке, ждёт рейса":cpDone(o,"pogruzka")?(notLeft(t)?"передана водителю":"уехала"):"ждёт погрузки"}</span>
      <button class="btn sm ghost" data-act="ho-open" data-stage="priemka" data-no="${o.no}">Акт приёмки</button></span></div>`}).join("")||`<p class="muted" style="margin:0">Пока нет принятых машин.</p>`}</div></div>`;
  return vProfile();
}

  return n.replace(/^MERCEDES(?:- ?| )BENZ\b/,"MERCEDES-BENZ").replace(/^MERCEDES\b(?!-)/,"MERCEDES-BENZ").replace(/^BMWX/,"BMW X").replace(/^VW\b/,"VOLKSWAGEN")
    .replace(/STEP ?WA?GO?N/,"STEPWGN").replace(/\bMAZDA ?([23])\b/,"MAZDA $1").replace(/\bCX ?-?(\d)/,"CX-$1").replace(/CX-3O\b/,"CX-30").replace(/\b(CHR|CH-R)\b/,"C-HR").replace(/\bX-RV\b/,"XR-V")
    .replace("NLSSAN","NISSAN").replace("RENAUIT","RENAULT").replace("MORNINIG","MORNING").replace(/\bK X1\b/,"KX1").replace(/(\s+\d{3,5})?(\s+(SROCHNO|СРОЧНО))?$/,m=>/^ \d{3,4}$/.test(m)&&/PEUGEOT|BMW/.test(n)?m:"").trim();
}
// самое длинное совпадение названия; поколение — по номеру кузова или году
function carLookup(name,vin,year){
  const n=carNorm(name);if(!n)return null;let best=[],bl=0;
  for(const c of CAR_DB)for(const a of c[8])if((n===a||n.startsWith(a+" "))&&a.length>=bl){if(a.length>bl){best=[];bl=a.length}if(!best.includes(c))best.push(c)}
  if(best.length<2)return best[0]||null;
  const f=(String(vin||"").toUpperCase().match(/^([A-Z0-9]{2,8})-/)||[])[1],y=+year;
  return (f&&best.find(c=>c[9].includes(f)))||best.find(c=>c[10]&&y&&y<c[10])||best.find(c=>!c[10])||best[0];
}

/* баланс с терминалом: начисления по отправленным машинам, оплаты — общими суммами */
const dKey=d=>{const m=/^(\d{1,2})\.(\d{1,2})(?:\.(\d{4}))?/.exec(d||"");return m?(+(m[3]||2026))*10000+(+m[2])*100+(+m[1]):0};
function termLedger(){
  // как в листе «АВТО»: Остаток = Депозит (все оплаты) − Отправки (цена перегруза погруженных машин)
  const acc=S.orders.filter(o=>o.transfer===TRANSFER_CITY&&cpDone(o,"term_out")).map(o=>{const h=hoOf(o,"term_out");
    return {d:h.doneAt.slice(0,5)+"."+new Date().getFullYear(),ts:h.doneTs||0,kind:"acc",sum:trCostOf(o)||0,noPrice:trCostOf(o)==null,
      text:`№${o.no} ${o.car} → ${o.city} · ${trClassOf(o)} · погружен с терминала${legTrip(o,1)?" на "+legTrip(o,1).id:""}`}});
  const pays=S.termPays.map((p,i)=>({...p,kind:"pay",i,text:"Оплата терминалу"+(p.note?" · "+p.note:"")}));
  const all=[...acc,...pays].sort((a,b)=>dKey(a.d)-dKey(b.d)||(a.ts||0)-(b.ts||0));
  let rest=0;all.forEach(r=>{rest+=r.kind==="pay"?r.sum:-r.sum;r.rest=rest});
  const deposit=pays.reduce((s,r)=>s+r.sum,0), sent=acc.reduce((s,r)=>s+r.sum,0);
  const exp=S.orders.filter(o=>o.transfer===TRANSFER_CITY&&!cpDone(o,"term_out")&&!o.delivered);
  return {acc,pays,all,deposit,sent,rest:deposit-sent,exp,expSum:exp.reduce((s,o)=>s+(trCostOf(o)||0),0),noPrice:acc.filter(r=>r.noPrice).length};
}

/* стартовое состояние демо: три машины уже прошли перегрузку в Новосибирске */
function seedScenario(){
  let ts=Date.now()-36e5, clock=8*60;
  const st=()=>{clock+=7;return today().slice(0,5)+" "+pad2(Math.floor(clock/60))+":"+pad2(clock%60)};
  const O=no=>S.orders.find(o=>o.no===no), T=id=>S.trips.find(t=>t.id===id);
  const move=(t,c)=>{t.km=NET[c][1];t.status="formed";stampPassing(t);t.events.push({t:st(),city:c,note:"Отметка водителя"})};
  const done=(o,stage)=>{const h=hoOf(o,stage);h.date=today();h.place=STAGES[stage].place(o);
    photoIdx(stage).forEach(i=>h.photos[i]={demo:true,name:"x.jpg",type:"image/jpeg"});
    vidSpec(o,stage).forEach(x=>{if(x.req)h.videos[x.i]={demo:true,name:"x.mp4",type:"video/mp4"}});
    h.act=[{demo:true,name:"x.jpg",type:"image/jpeg"}];h.doneAt=st();h.doneTs=ts+=60000;sealSec(o,stage,h.doneAt);
    if(stage==="term_out")h.mode=stageMode(o,stage);
    if(stage==="vygruzka")o.delivered=true;
    const cp=checkpointsOf(o).find(c=>c.id===stage),t=legTrip(o,cp.leg);
    const what={priemka:"Принят к перевозке",pogruzka:"Погружен в автовоз",term_in:"Принят на терминал",term_out:"Погружен с терминала на рейс "+(t?t.id:""),vygruzka:"Выдан получателю"}[stage];
    const sc=secOf(o,stage);if(t)t.events.push({t:h.doneAt,city:h.place,note:`${what} №${o.no} ${o.car} · сдал ${sc.giveName}, принял ${sc.takeName}`})};
  const pay=(sum,note)=>S.termPays.push({d:today(),sum,ts:ts+=60000,how:"карта",note});
  // оплата 1, затем №680: R-01 до терминала, приём, погрузка на R-03
  pay(30000,"п/п 1");
  move(T("R-01"),"Новосибирск");
  done(O(680),"term_in");done(O(680),"term_out");T("R-03").status="formed";
  pay(40000,"п/п 2");
  // №681 и №682 сняты с прямого R-02 на перегрузку, дальше рейсом R-05 с водителем Олегом
  S.users.find(u=>u.id==="u6").status="active";
  const r5=newTrip("Новосибирск","Краснодар","22.10");
  Object.assign(r5,{driverId:"u6"});syncTrips(drvOf("u6"));
  [681,682].forEach(no=>{const o=O(no);setTransfer(o,"R-02","Перераспределение загрузки");o.rerouted.at=st();o.legs[1].trip=r5.id});
  T("R-02").status="formed";
  [681,682].forEach(no=>{done(O(no),"priemka");done(O(no),"pogruzka")});
  ["Хабаровск","Красноярск","Новосибирск"].forEach(c=>move(T("R-02"),c));
  [681,682].forEach(no=>done(O(no),"term_in"));
  [681,682].forEach(no=>done(O(no),"term_out"));
  ["Омск","Уфа","Воронеж","Краснодар"].forEach(c=>move(r5,c));
  [681,682].forEach(no=>done(O(no),"vygruzka"));
  pay(100000,"п/п 3");
}

const DOC_KEYS=Object.keys(DOC_FIELDS);
function drvOf(id){return S.drivers.find(d=>d.id===id)}
function drvShort(d){const p=d.name.trim().split(/\s+/);return (p[1]||p[0])+" "+(p[0][0]||"")+"."}
const truckStr=d=>[d.tractor.model,d.tractor.plate].filter(Boolean).join(" · ")||"тягач не указан";
const trailerStr=d=>[d.trailer.model,d.trailer.plate].filter(Boolean).join(" · ");
function drvActive(d){const u=S.users.find(x=>x.id===d.userId);return !u||u.status==="active"}
function docCount(d){return DOC_KEYS.filter(k=>d.docs[k]&&d.docs[k].status==="done").length}
function licExpired(d){const v=(d.data.lic||{}).valid_until;return v&&dKey(v)&&dKey(v)<dKey(today())}

function applyDoc(d,k,r){
  d.data[k]={...(d.data[k]||{}),...r};
  if(k==="p1"&&r.last_name){const n=[r.last_name,r.first_name,r.middle_name].filter(Boolean).join(" ");if(n)d.name=n}
  if(k==="t1f"){if(r.plate)d.tractor.plate=r.plate;if(r.model)d.tractor.model=r.model}
  if(k==="t2f"){if(r.plate)d.trailer.plate=r.plate;if(r.model)d.trailer.model=r.model}
  if((k==="t1b"||k==="t2b")&&!d.own&&r.owner&&!d.company.name)d.company.name=r.owner;
  syncTrips(d);
}
function syncTrips(d){S.trips.filter(t=>t.driverId===d.id&&notLeft(t)).forEach(t=>{t.driver=drvShort(d);t.truck=truckStr(d);t.trailer=trailerStr(d);t.carrier=d.own?"собственный":(d.company.name||"наёмный")})}
async function readDoc(id,k,file){
  const d=drvOf(id);if(!/^image\//.test(file.type)){toast("Нужна фотография документа");return}
  const url=URL.createObjectURL(file);d.docs[k]={url,status:"reading"};render();
  const fin=(st,msg)=>{if(d.docs[k].url!==url)return;d.docs[k]={url,status:st,msg};render()};
  if(!(AI.fn&&AI.images)){fin("manual","Автораспознавание работает, когда страница открыта в Claude. Заполните поля ниже по фото.");return}
  const F=DOC_FIELDS[k], prompt=`На фото — ${F.label} (Россия). Прочитай документ и верни только JSON-объект с полями: ${F.f.map(x=>`"${x[0]}" (${x[1]})`).join(", ")}. Даты в формате ДД.ММ.ГГГГ. Госномер — как на документе, например «А 482 КР 125». Если поле не видно — null. Если на фото не этот документ — {"error":"wrong_doc"}.`;
  try{const r=await AI.fn.json(prompt,{images:[file]});
    if(!r||r.error){fin("error","На фото не видно этого документа. Сфотографируйте целиком, без бликов.");return}
    const clean={};F.f.forEach(([key])=>{if(r[key]!=null&&r[key]!=="")clean[key]=String(r[key])});applyDoc(d,k,clean);fin("done","Распознано — проверьте поля")}
  catch(e){if(e&&["not_granted","images_unavailable","sampling_disabled"].includes(e.code))AI.images=false;fin("manual","Распознать не удалось. Заполните поля ниже по фото.")}
}

/* импорт реестра водителей из Excel (формат «Транспортное средство | Водители | Дата рождения | Паспорт | Дата выдачи | Телефон») */
const PLATE_L="АВЕКМНОРСТУХABEKMHOPCTYX";
const toCyr=s=>s.toUpperCase().replace(/[ABEKMHOPCTYX]/g,c=>"АВЕКМНОРСТУХ"["ABEKMHOPCTYX".indexOf(c)]);
function splitPlate(part,trailer){
  const re=trailer?new RegExp(`([${PLATE_L}]{2})\\s?(\\d{4})\\s?(\\d{2,3})`,"i"):new RegExp(`([${PLATE_L}])\\s?(\\d{3})\\s?([${PLATE_L}]{2})\\s?(\\d{2,3})`,"i");
  if(trailer)part=part.replace(new RegExp(`([${PLATE_L}])0(?=\\d{6,7}\\b)`,"gi"),"$1О"); // «A0214325» → «АО 2143 25»
  const m=re.exec(part);
  if(!m){const toks=part.replace(/[,.:]+/g," ").trim().split(/\s+/),last=toks[toks.length-1]||"";
    // иностранный номер (транзит): последний токен из букв и цифр
    if(toks.length>1&&/\d/.test(last)&&/[A-ZА-Я]/i.test(last)&&last.length>=5)return {model:toks.slice(0,-1).join(" "),plate:last.toUpperCase()};
    return {model:part.replace(/[,.:]+$/,"").trim(),plate:""}}
  const plate=trailer?`${toCyr(m[1])} ${m[2]} ${m[3]}`:`${toCyr(m[1])} ${m[2]} ${toCyr(m[3])} ${m[4]}`;
  return {model:part.replace(m[0],"").replace(/[,.:]+/g," ").replace(/\s+/g," ").trim(),plate};
}
function parseVehicle(s){let [a,b]=String(s||"").split(/прицеп[:\s]*/i);a=a||"";
  if(!b){const m=new RegExp(`[${PLATE_L}]\\s?\\d{3}\\s?[${PLATE_L}]{2}\\s?\\d{2,3}`,"i").exec(a);if(m){b=a.slice(m.index+m[0].length);a=a.slice(0,m.index+m[0].length)}}
  return {tractor:splitPlate(a,false),trailer:splitPlate(b||"",true)}}
const xDate=v=>v instanceof Date?pad2(v.getDate())+"."+pad2(v.getMonth()+1)+"."+v.getFullYear():String(v||"").trim();
function xPhone(v){const d=String(v||"").replace(/\D/g,"");return d.length===10?fmtPhone("7"+d):d.length===11?fmtPhone("7"+d.slice(1)):String(v||"").trim()}
function loadXLSX(){return window.XLSX?Promise.resolve():new Promise((ok,no)=>{const s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";s.onload=ok;s.onerror=no;document.head.appendChild(s)})}
async function importDrivers(file){
  try{await loadXLSX()}catch(e){toast("Не удалось загрузить модуль чтения Excel");return}
  let rows;try{const wb=XLSX.read(await file.arrayBuffer(),{type:"array",cellDates:true});rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:true,defval:null})}
  catch(e){toast("Файл не читается. Нужен .xlsx или .xls");return}
  const hi=rows.findIndex(r=>r&&String(r[2]||"").trim()==="Водители");
  if(hi<0){toast("Не найден столбец «Водители». Проверьте формат файла");return}
  let group={own:true,label:"",company:"",inn:""},veh=null,added=0,skipped=0;const companies=new Set();
  rows.slice(hi+1).forEach(r=>{
    if(!r)return;const a=r[0]!=null?String(r[0]).trim():"",c=r[2]!=null?String(r[2]).trim():"";
    if(!c){if(!a)return;
      if(/^наемник|^наёмник/i.test(a)){group={own:false,label:a,company:"",inn:""};veh=null;return}
      if(/^транзит$/i.test(a)){group={own:false,label:a,company:"",inn:""};veh=null;return}
      const inn=(/ИНН[:\s]*(\d{10,12})/i.exec(a)||[])[1]||"";
      group={own:group.own&&!inn&&!/^(ИП|ООО|OOO)/i.test(a),label:a,company:a.replace(/\(.*$/,"").replace(/\s+/g," ").trim(),inn};veh=null;return}
    if(a)veh=parseVehicle(a);
    const pass=String(r[4]||"").trim().split(/\s+/), nm=c.split(/\s+/);
    const key=[c,r[4],veh&&veh.tractor.plate].join("|");
    if(S.drivers.some(d=>d.importKey===key)){skipped++;return}
    const d=newDriver(group.own);
    Object.assign(d,{importKey:key,name:c,phone:xPhone(r[6]),group:group.label,
      company:{name:group.own?"":group.company,inn:group.inn,phone:""},
      tractor:veh?{...veh.tractor}:{model:"",plate:""},trailer:veh?{...veh.trailer}:{model:"",plate:""}});
    d.data.p1={last_name:nm[0]||"",first_name:nm[1]||"",middle_name:nm.slice(2).join(" "),birth_date:xDate(r[3]),series:pass.length>1?pass[0]:"",number:pass.length>1?pass.slice(1).join(" "):pass[0]||"",issue_date:xDate(r[5])};
    d.fromXls=true;if(!group.own&&group.company)companies.add(group.company);added++;
  });
  S.drvOpen=null;render();toast(`Импорт: добавлено водителей ${added}, компаний ${companies.size}${skipped?`, повторов пропущено ${skipped}`:""}`);
}

// какие фото нужны на этапе: при погрузке с терминала — 2 снимка приёмщика на автовозе и 10 ракурсов приёмки водителем
function photoSpec(st){if(st==="term_out")return [{i:0,t:"Авто на автовозе · общий вид",h:"Машина на своём месте в автовозе, видна целиком",by:"terminal"},{i:1,t:"Крепление на автовозе",h:"Колёса закреплены: видны ремни и упоры",by:"terminal"}]
    .concat(HO_PHOTOS.map((p,k)=>({i:10+k,t:p[0],h:p[1],by:"driver"})));

const TERM_PAYTO="Новосибирск (терминал)";
function termSettle(){
  const L=termLedger(), sum=o=>o.tariff+o.cashback, mine=S.orders.filter(o=>o.payTo===TERM_PAYTO);
  const got=mine.filter(o=>o.payDel&&o.collectedAt), wait=mine.filter(o=>!o.payDel);
  // плюс — в пользу перевозчика (терминал должен ему), минус — в пользу терминала
  const rows=[
    ...L.pays.map(p=>({d:p.d,ts:p.ts||0,text:"Оплата перевозчика терминалу"+(p.note?" · "+p.note:""),v:p.sum})),
    ...L.acc.map(r=>({d:r.d,ts:r.ts||0,text:"Перегруз: "+r.text.split(" · погружен")[0],v:-r.sum,noPrice:r.noPrice})),
    ...got.map(o=>({d:o.collectedAt.slice(0,5)+"."+new Date().getFullYear(),ts:o.collectedTs||0,text:`Оплата клиента на терминале: №${o.no} ${o.car}`,v:sum(o)})),
    ...S.termIn.map(x=>({d:x.d,ts:x.ts||0,text:"Перечисление терминала перевозчику"+(x.note?" · "+x.note:""),v:-x.sum}))
  ].sort((a,b)=>dKey(a.d)-dKey(b.d)||a.ts-b.ts);
  let bal=0;rows.forEach(r=>{bal+=r.v;r.bal=bal});
  const plus=rows.filter(r=>r.v>0).reduce((s,r)=>s+r.v,0),minus=rows.filter(r=>r.v<0).reduce((s,r)=>s-r.v,0);
  return {L,rows,wait,got,plus,minus,net:plus-minus,sum,
    credit:L.sent-L.deposit, debit:got.reduce((s,o)=>s+sum(o),0)-S.termIn.reduce((s,x)=>s+x.sum,0)};
}

  Object.assign(t,{tm:a.length>1?a[0]:(t.truck==="автовоз не указан"?"":t.truck||""),tp:a[1]||"",rm:b.length>1?b[0]:t.trailer||"",rp:b[1]||""})}}
function tfCompose(t){t.truck=[t.tm,t.tp].filter(Boolean).join(" · ")||"автовоз не указан";t.trailer=[t.rm,t.rp].filter(Boolean).join(" · ")}
function termYardCars(city){return S.orders.filter(o=>o.transfer===city&&cpDone(o,"term_in")&&!cpDone(o,"term_out"))}

const RX_PROMPT=`На фото кассовый чек водителя автовоза (Россия, расходы в рейсе). Прочитай его и верни только JSON-объект:
{"date":"ДД.ММ.ГГГГ или null","time":"ЧЧ:ММ или null","seller":"название продавца, АЗС или сервиса","city":"город, если указан, иначе null","lines":[{"category":"fuel, parking, zip, repair, tires, tirefit, wash, pass, daily или toll","description":"коротко, что куплено, например «ДТ, 160 л × 72,10» или «кофе, вода»","amount":сумма по этой статье числом,"liters":литры для топлива или null}],"amount":итоговая сумма чека числом,"fiscal":"ФН, ФД, ФП, если видны, иначе null","confidence":"high, medium или low","notes":"что не удалось прочитать, иначе пустая строка"}
Разложи позиции чека по статьям: в lines одна строка на статью, сумма строк равна итогу чека.
Статьи: топливо (ДТ, АИ-92/95, газ, AdBlue) — fuel. Стоянка, душ — parking. Еда, кофе, чай, вода, напитки, сигареты, снеки — всегда daily, из любого чека, в том числе с АЗС и из магазина запчастей. Покупки в магазине или на АЗС: шланги, перчатки, масло, антифриз, тормозная и омывающая жидкость, фитинги, инструменты, болты, дворники, тряпки, фильтры и другие запчасти — zip. Чек из автосервиса или заказ-наряд — весь ремонт, ТО и запчасти по нему — repair. Покупка шин — tires. Шиномонтаж, балансировка, ремонт колеса — tirefit. Мойка — wash. Проездной, разрешение на проезд — pass. Платон и платные трассы — toll. Если на фото не кассовый чек, верни {"error":"not_receipt"}.`;
async function readReceipt(file,isDemo){
  if(!/^image\//.test(file.type)){toast("Нужна фотография чека: JPG, PNG или WebP");return}
  const url=URL.createObjectURL(file);
  S.rx={status:"reading",photo:url,src:"фото"};render();
  const done=(draft,extra)=>{if(S.rx.photo!==url)return;S.rx={status:"review",photo:url,src:"фото",draft,...extra};render()};
  if(AI.fn&&AI.images){
    AI.ctl=new AbortController();
    try{
      const r=await AI.fn.json(RX_PROMPT,{images:[file],signal:AI.ctl.signal});
      if(!r||r.error){done(emptyDraft(),{msg:"На фото не видно кассового чека. Сфотографируйте чек целиком при хорошем свете или заполните поля вручную.",msgType:"warn"});return}
      done(draftFromLines(r),{conf:r.confidence||"medium",msg:r.notes||"",msgType:"warn"});
    }catch(e){
      if(e&&e.code==="cancelled"){if(S.rx.photo===url){S.rx={status:"idle"};render()}return}
      const hide=["not_granted","sampling_disabled","not_declared","capability_disabled","capability_removed","images_unavailable"];
      if(e&&hide.includes(e.code))AI.images=false;
      const msg={not_granted:"Распознавание не разрешено. Заполните поля по фото.",image_rejected:"Не удалось открыть фото. Попробуйте другой снимок.",rate_limited:"Слишком много запросов подряд. Подождите минуту или заполните вручную.",invalid_json:"Не получилось разобрать чек. Заполните поля по фото."}[e&&e.code]||"Распознавание не сработало. Заполните поля по фото.";
      done(emptyDraft(),{msg,msgType:"warn"});
    }
    return;

function draftFromLines(r){
  const lines=(Array.isArray(r.lines)?r.lines:[]).filter(l=>l&&+l.amount>0).map(l=>({cat:CATS[l.category]?l.category:"zip",desc:l.description||"",amount:l.amount,liters:l.liters??""}));
  const base={d:r.date||today(),time:r.time||"",seller:r.seller||"",city:r.city||"",fiscal:r.fiscal||""};
  if(lines.length<=1){const l=lines[0]||{cat:CATS[r.category]?r.category:"zip",desc:r.description||"",amount:r.amount??"",liters:r.liters??""};return {...base,...l,amount:l.amount||r.amount||""}}
  return {...base,cat:lines[0].cat,desc:lines[0].desc,liters:lines[0].liters,amount:r.amount||lines.reduce((a,l)=>a+(+l.amount||0),0),split:lines};
}

async function sign(){
  if(S.codeIn!==S.sms){S.errs={code:"Код не совпадает. Проверьте SMS или запросите новый код"};render();return}
  const q=quote(),f=S.f,no=S.nextNo++;
  const hash=await sha256(JSON.stringify({no,f,q}));
  const d=new Date(),time=String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");
  const fio=f.fio.trim().split(/\s+/),short=fio[0]+" "+fio.slice(1).map(x=>x[0]+".").join(" "),fioFull=f.fio.trim();
  const digits=f.phone.replace(/\D/g,"");
  const order={no,date:today(),fio:fioFull,car:f.car,vin:f.vin.toUpperCase(),year:+f.year,color:f.color,body:f.body,city:f.city,client:short,
    phone:"+7 "+digits.slice(1,4)+" ***-**-"+digits.slice(-2),tariff:q.tariff,cashback:q.cashback,value:q.value,
    partner:S.partner?PARTNERS[S.partner].name:"—",trip:null,payDel:false,payIns:false,payTo:"",payForm:"",
    signedAt:"21.10 "+time+" ПЭП",token:tok(no),fresh:true,hash:hash.slice(0,32)+"…",time,loginPhone:digits,
    phoneFull:f.phone,passport:{ser:f.pser,num:f.pnum,issued:f.pissued,date:f.pdate.split("-").reverse().join(".")},address:f.addr};
  S.orders.forEach(o=>o.fresh=false);S.orders.push(order);S.signed=order;render();window.scrollTo(0,0);
}
